<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#172b3a" />
    <title>Offline library — Arkive</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font:
          16px system-ui,
          sans-serif;
        color: #172b3a;
        background: #f1f5f9;
      }
      main {
        width: min(560px, 100%);
        padding: 32px;
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
      }
      a {
        color: #0369a1;
      }
      p {
        color: #475569;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Offline library</h1>
      <p id="status">Checking for uploaded ZIM content…</p>
      <p id="help" hidden>
        Upload one or more <code>.zim</code> files to the
        <code>zim/</code> folder using FTP. Arkive will add them to the library
        automatically.
      </p>
      <p><a href="/">← Back to Arkive</a></p>
    </main>
    <script>
      const target = `http://${window.location.hostname}:8080/`;
      const status = document.querySelector("#status");
      const help = document.querySelector("#help");
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 3500);
      fetch(target, { mode: "no-cors", signal: controller.signal })
        .then(() => {
          clearTimeout(timeout);
          window.location.replace(target);
        })
        .catch(() => {
          status.textContent = "No ZIM library is available yet.";
          help.hidden = false;
        });
    </script>
  </body>
</html>
